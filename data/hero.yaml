  - { page: "/portfolio/mood",            image: "images/1.jpg",  label: "Mood – Gifts & Home", focus: "center 12%" }
  - { page: "/portfolio/cock-bottle",     image: "images/1.png",  label: "Cock & Bottle" }
  - { page: "/portfolio/golden-pheasant", image: "images/1.jpg",  label: "The Golden Pheasant" }
  - { page: "/portfolio/the-fleece",      image: "images/1.jpg",  label: "The Fleece" }
  - { page: "/portfolio/white-bull",      image: "images/1.jpg",  label: "White Bull", focus: "center 62%" }
