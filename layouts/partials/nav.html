<div class="top-0 z-50 w-full text-dark bg-gray-100 md:sticky">
    <nav class="bg-white dark:bg-gray-900 fixed w-full z-50 top-0 start-0 border-b border-gray-200 dark:border-gray-600"
        x-data="{ isOpen: false }">
        <div class="relative max-w-screen-xl mx-auto px-3 py-2 flex items-center justify-between min-h-[56px] lg:min-h-[64px]">

            <!-- Left: menu toggle (mobile) / links (desktop) -->
            <div class="flex items-center justify-start">
                <button @click="isOpen = !isOpen" type="button"
                    class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-ink rounded-lg lg:hidden hover:bg-ice-light focus:outline-none focus:ring-2 focus:ring-secondary-200"
                    aria-controls="navbar-sticky" :aria-expanded="isOpen.toString()">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 17 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M1 1h15M1 7h15M1 13h15" />
                    </svg>
                </button>
                <ul class="hidden lg:flex items-center text-ink lg:space-x-5 xl:space-x-7">
                    <li><a class="py-2 text-xs xl:text-sm font-bold uppercase tracking-wider hover:text-primary whitespace-nowrap"
                            href="https://shop.thesignmakers.com" target="_blank">Buy Signs Online</a></li>
                    <li><a class="py-2 text-xs xl:text-sm font-bold uppercase tracking-wider hover:text-primary"
                            href="/about/">About</a></li>
                    <li><a class="py-2 text-xs xl:text-sm font-bold uppercase tracking-wider hover:text-primary"
                            href="/services/">Services</a></li>
                    <li><a class="py-2 text-xs xl:text-sm font-bold uppercase tracking-wider hover:text-primary"
                            href="/portfolio/">Portfolio</a></li>
                </ul>
            </div>

            <!-- Centre: logo -->
            <a href="/" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center">
                <img src="/images/sign-makers-new.svg" class="h-5 min-[400px]:h-6 sm:h-8 lg:h-10 xl:h-11 w-auto"
                    alt="Business Signs, Sign Design, Manufacturing and Installation - The Sign Makers">
            </a>

            <!-- Right: call to action -->
            <div class="flex items-center justify-end">
                <a href="/contact"
                    class="inline-flex items-center px-2 py-1.5 sm:px-5 sm:py-2.5 text-[10px] sm:text-sm cta-label !tracking-normal sm:!tracking-wider text-white bg-primary rounded-lg whitespace-nowrap hover:bg-primary-600 focus:ring-4 focus:ring-primary-200">Request
                    Quote</a>
            </div>
        </div>

        <!-- Mobile menu -->
        <div x-show="isOpen" x-cloak @click.outside="isOpen = false" class="lg:hidden border-t border-gray-200"
            id="navbar-sticky">
            <ul class="flex flex-col p-4 text-ink bg-white">
                <li><a class="block py-2 text-sm font-bold uppercase tracking-wider hover:text-primary"
                        href="https://shop.thesignmakers.com" target="_blank">Buy Signs Online</a></li>
                <li><a class="block py-2 text-sm font-bold uppercase tracking-wider hover:text-primary"
                        href="/about/">About</a></li>
                <li><a class="block py-2 text-sm font-bold uppercase tracking-wider hover:text-primary"
                        href="/services/">Services</a></li>
                <li><a class="block py-2 text-sm font-bold uppercase tracking-wider hover:text-primary"
                        href="/portfolio/">Portfolio</a></li>
            </ul>
        </div>
    </nav>
</div>
